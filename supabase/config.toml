[functions.publish-to-social]
enabled = true
verify_jwt = true
import_map = "./functions/publish-to-social/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/publish-to-social/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/publish-to-social/*.html" ]

[functions.linkedin-auth-callback]
verify_jwt = false

[functions.twitter-auth-callback]
verify_jwt = false

[functions.delete-user]
verify_jwt = true

[functions.instagram-auth-callback]
verify_jwt = false

[functions.instagram-auth-start]
verify_jwt = true

[functions.threads-auth-start]
verify_jwt = true

[functions.threads-auth-callback]
verify_jwt = false

[functions.facebook-auth-callback]
verify_jwt = false