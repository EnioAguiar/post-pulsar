    .container { fill: none; stroke: #333; stroke-width: 2; }
  </style>
  <rect class="bg" width="1080" height="1920"/>
  <text x="540" y="400" class="text-main">
    <tspan x="540" dy="-1.2em">Tired of manual</tspan>
    <tspan x="540" dy="1.2em">repurposing?</tspan>
  </text>

  <rect x="340" y="700" width="400" height="150" class="container"/>
  <rect x="440" y="900" width="200" height="200" class="container"/>
  <rect x="390" y="1150" width="300" height="100" class="container"/>

  <g transform="translate(20 80)">
    <path d="M 340 700 l 150 -50 l 50 150 z" class="primary" transform="translate(50 20) rotate(15)"/>
    <path d="M 400 750 l 200 20 l -30 150 z" class="primary" transform="translate(100 -40) rotate(-10)"/>
    <path d="M 600 770 l 140 80 l -100 100 z" class="primary" transform="translate(-150 250) rotate(30)"/>
    <path d="M 240 950 l 250 50 l -50 200 z" class="primary" transform="translate(150 150) rotate(-25)"/>
    <path d="M 490 1000 l 210 100 l -150 150 z" class="primary" transform="translate(-50 180) rotate(5)"/>
