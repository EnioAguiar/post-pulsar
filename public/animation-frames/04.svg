<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0A0A0A; }
    .primary { fill: #FF4500; }
    .text-main { fill: #E0E0E0; font-family: monospace; font-size: 70px; text-anchor: middle; }
    .text-input { fill: #888; font-family: monospace; font-size: 30px; text-anchor: start; }
    .input-box { fill: #1a1a1a; stroke: #333; stroke-width: 2; }
  </style>
  <rect class="bg" width="1080" height="1920"/>
  <text x="540" y="400" class="text-main" opacity="0.3">
    <tspan x="540" dy="-1.2em">Tired of manual</tspan>
    <tspan x="540" dy="1.2em">repurposing?</tspan>
  </text>

  <text x="540" y="700" class="text-main">
    <tspan x="540" dy="-1.2em">Paste a URL.</tspan>
    <tspan x="540" dy="1.2em">Let AI do the work.</tspan>
  </text>

  <rect x="240" y="900" width="600" height="80" rx="10" class="input-box"/>
  <text x="260" y="955" class="text-input">postpulsar.com/blog/...</text>
</svg>